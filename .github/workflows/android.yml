name: Android
on:
  push:
    paths: ['android/**', 'search-card.js', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'search-card.js', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build, lint, and compare with web card
        working-directory: android
        run: ./gradlew assembleDebug test lint verifySearchCardParity --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: search-card-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 17 SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-api-37
          path: android/app/build/reports/androidTests/
