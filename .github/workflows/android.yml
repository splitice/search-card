name: Android
on:
  push:
    paths: ['android/**', 'search-card.js', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'search-card.js', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      live-account:
        description: Run the read-only login smoke test using ANDROID_RUNTIME_TEST_ACCOUNT
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build, lint, and compare with web card
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease test lint verifySearchCardParity --console=plain
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: search-card-pr-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: search-card-signing-inputs
          retention-days: 1
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/
  sign:
    # Keep private keys out of PR jobs and Gradle. This job only runs SDK signing tools.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - name: Install signing tools
        run: sdkmanager 'build-tools;37.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: search-card-signing-inputs
          path: apk-inputs
      - name: Sign and verify APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          signing_dir="$(mktemp -d "$RUNNER_TEMP/search-card-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          signer="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          for variant in debug release; do
            if [ "$variant" = debug ]; then
              input="apk-inputs/debug/app-debug.apk"
            else
              input="apk-inputs/release/app-release-unsigned.apk"
            fi
            output="signed/$variant/app-$variant.apk"
            mkdir -p "signed/$variant"
            "$signer" sign --ks "$signing_dir/release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --v4-signing-enabled false --out "$output" "$input"
            "$signer" verify --verbose --print-certs "$output"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: search-card-debug
          if-no-files-found: error
          path: signed/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: search-card-release
          if-no-files-found: error
          path: signed/release/app-release.apk
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install Android 17 SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          HA_RUNTIME_ACCOUNT: ${{ inputs.live-account && secrets.ANDROID_RUNTIME_TEST_ACCOUNT || '' }}
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          emulator-build: '16195039' # Emulator 37.2.7
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-linux-hw-accel: false
          # API 37's mapper.ranchu aborts if the host advertises read-color-buffer DMA.
          emulator-options: -no-window -gpu swiftshader -feature -HasSharedSlotsHostMemoryAllocator -no-snapshot -noaudio -no-boot-anim -accel on -no-metrics -show-kernel
          disable-animations: true
          pre-emulator-launch-script: mkdir -p android/device-diagnostics; nohup timeout 1200 adb logcat -b all -v threadtime > android/device-diagnostics/logcat.txt 2>&1 &
          script: |
            adb shell getprop ro.build.version.sdk | grep -qx 37
            adb shell getprop ro.build.fingerprint > android/device-diagnostics/fingerprint.txt
            bash android/tools/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-api-37
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/device-diagnostics/
