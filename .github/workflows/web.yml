name: Web card
on:
  push:
    paths: ['search-card.js', 'tests/web/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  pull_request:
    paths: ['search-card.js', 'tests/web/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dropdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-traces
          path: test-results/
